[project]
name = "wafersim"
version = "0.1.0"
description = "A SimPy-based wafer-scale accelerator simulator with a Chisel-oriented hardware path."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "simpy>=4.1,<5",
]

[project.scripts]
wafersim = "wafersim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

