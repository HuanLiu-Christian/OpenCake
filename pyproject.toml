[project]
name = "wafersim"
version = "0.1.0"
description = "A Python/SimPy wafer-scale accelerator simulator for GEMV9-style streaming experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "simpy>=4.1,<5",
]

[project.optional-dependencies]
chakra = [
  "protobuf>=5,<6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
