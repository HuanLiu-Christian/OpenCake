[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencake-wafer-gemm"
version = "0.1.0"
description = "TimeLoop-driven wafer-scale GEMM performance model"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
