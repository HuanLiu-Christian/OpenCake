[project]
name = "wafersim"
version = "0.2.0"
description = "OpenCake: an MLIR-to-wafer compiler and dual-backend GEMM simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "protobuf>=5,<7",
]

[project.optional-dependencies]
chakra = [
  "protobuf>=5,<7",
]
iree = [
  "iree-compiler",
]
zigzag = [
  "protobuf>=5,<6",
  "zigzag-dse>=3.8,<4",
]
stream = [
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"wafersim.opencake.proto" = ["*.proto"]
